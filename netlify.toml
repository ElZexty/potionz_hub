[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "protect-shop"
  path = "/*"

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200

[[redirects]]
  from = "/api/redeem"
  to = "/.netlify/functions/redeem"
  status = 200

[[redirects]]
  from = "/api/setup"
  to = "/.netlify/functions/setup"
  status = 200

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200
